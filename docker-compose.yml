version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: manufacturing_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: manufacturing_ai
      POSTGRES_USER: manufacturing_user
      POSTGRES_PASSWORD: change-this-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manufacturing_user -d manufacturing_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: manufacturing_app
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=docker-manufacturing-secret-key-2026
      - DATABASE_URL=postgresql://manufacturing_user:change-this-password@db:5432/manufacturing_ai
      - ALLOWED_HOSTS=*
      - EMBEDDING_PROVIDER=deterministic
      - LLM_PROVIDER=openai
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

