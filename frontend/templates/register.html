{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Manufacturing Manual Assistant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    body {
      background: radial-gradient(circle at top right, #1e293b, #0f172a);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .register-card {
      max-width: 500px;
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div class="register-card p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 p-3 mb-2">
        <i class="bi bi-person-plus-fill fs-2"></i>
      </div>
      <h3 class="fw-bold text-dark mt-2 mb-1">Create Account</h3>
      <p class="text-muted small">Register to access the Manufacturing Manual Assistant</p>
    </div>

    <div id="register-error-alert" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

    <form id="register-form">
      {% csrf_token %}
      
      <div class="mb-3">
        <label for="username" class="form-label small fw-semibold text-secondary">Username *</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-secondary"></i></span>
          <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="e.g. nithish_eng" required autofocus>
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label small fw-semibold text-secondary">Email Address (Optional)</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-secondary"></i></span>
          <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="nithish@manufacturing.local">
        </div>
      </div>

      <div class="mb-3">
        <label for="role" class="form-label small fw-semibold text-secondary">Role *</label>
        <select class="form-select" id="role" name="role" required>
          <option value="ENGINEER" selected>Engineer (Ask questions & inspect citations)</option>
          <option value="SUPERVISOR">Supervisor (Review team query logs & quality)</option>
          <option value="ADMIN">Administrator (Upload manuals & register machinery)</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label small fw-semibold text-secondary">Password * (Min 6 characters)</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-secondary"></i></span>
          <input type="password" class="form-control border-start-0" id="password" name="password" minlength="6" placeholder="••••••••" required>
        </div>
      </div>

      <div class="mb-4">
        <label for="confirm_password" class="form-label small fw-semibold text-secondary">Confirm Password *</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-lock text-secondary"></i></span>
          <input type="password" class="form-control border-start-0" id="confirm_password" name="confirm_password" minlength="6" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" id="register-submit-btn" class="btn btn-primary w-100 py-2 fw-semibold">
        <i class="bi bi-check-circle-fill me-1"></i> Register & Enter Assistant
      </button>
    </form>

    <div class="mt-4 pt-3 border-top text-center">
      <small class="text-muted">Already have an account? 
        <a href="/login/" class="text-primary fw-semibold text-decoration-none">Sign In here</a>
      </small>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script src="{% static 'js/app.js' %}"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const role = document.getElementById('role').value;
      const p = document.getElementById('password').value;
      const cp = document.getElementById('confirm_password').value;
      const btn = document.getElementById('register-submit-btn');
      const errBox = document.getElementById('register-error-alert');

      if (p !== cp) {
        errBox.textContent = "Passwords do not match.";
        errBox.classList.remove('d-none');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>Creating Account...`;
      errBox.classList.add('d-none');

      try {
        const resp = await App.apiFetch('/api/auth/register/', {
          method: 'POST',
          body: {
            username: u,
            email: email,
            role: role,
            password: p,
            confirm_password: cp
          }
        });

        if (!resp) return;
        const data = await resp.json();

        if (resp.ok) {
          App.setTokens(data.access_token, data.refresh_token);
          App.showToast("Account created successfully! Welcome " + data.user.username + "!", "success");
          setTimeout(() => {
            if (data.user && data.user.role === 'ADMIN') {
              window.location.href = "/admin-panel/";
            } else if (data.user && data.user.role === 'SUPERVISOR') {
              window.location.href = "/supervisor/";
            } else {
              window.location.href = "/engineer-dashboard/";
            }
          }, 600);
        } else {
          errBox.textContent = data.detail || "Registration failed. Please check form inputs.";
          errBox.classList.remove('d-none');
        }
      } catch (err) {
        errBox.textContent = "Network error: " + err.message;
        errBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="bi bi-check-circle-fill me-1"></i> Register & Enter Assistant`;
      }
    });
  </script>
</body>
</html>
