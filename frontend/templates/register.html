<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Plate Inspection System (BIT-PLATE-CV-1.0)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .register-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }
        .register-header {
            background-color: #1e293b;
            color: #ffffff;
            padding: 1.75rem 2rem;
            text-align: center;
            border-bottom: 2px solid #2563eb;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="register-header">
            <div class="fs-4 fw-bold">
                <i class="bi bi-disc-fill text-primary me-2"></i>BIT-PLATE-CV
            </div>
            <div class="text-secondary small mt-1">Register New Operator Account</div>
            <div class="badge bg-secondary mt-2">Model: BIT-PLATE-CV-1.0</div>
        </div>

        <div class="p-4">
            <div id="register-alert" class="alert alert-danger d-none" role="alert"></div>

            <form id="register-form">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold text-secondary small">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" required placeholder="Choose a username">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold text-secondary small">Email (Optional)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="operator@factory.local">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold text-secondary small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" required minlength="6" placeholder="At least 6 characters">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="role" class="form-label fw-semibold text-secondary small">Role</label>
                    <select class="form-select" id="role">
                        <option value="OPERATOR" selected>Operator (Upload & Inspect)</option>
                        <option value="SUPERVISOR">Supervisor (Review & Metrics)</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="register-btn">
                    <span id="btn-text"><i class="bi bi-check2-circle me-1"></i> Create Account</span>
                    <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
                <span class="text-muted small">Already have an account?</span>
                <a href="/login/" class="text-primary small fw-semibold ms-1">Sign In</a>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('register-alert');
            const submitBtn = document.getElementById('register-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            alertBox.classList.add('d-none');
            btnText.classList.add('d-none');
            btnSpinner.classList.remove('d-none');
            submitBtn.disabled = true;

            const payload = {
                username: document.getElementById('username').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            };

            try {
                const csrfInput = document.querySelector('[name=csrfmiddlewaretoken]');
                const headers = { 'Content-Type': 'application/json' };
                if (csrfInput && csrfInput.value) {
                    headers['X-CSRFToken'] = csrfInput.value;
                }

                const res = await fetch('/api/auth/register/', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (res.ok) {
                    alertBox.className = 'alert alert-success small';
                    alertBox.textContent = 'Account created! Redirecting to login...';
                    alertBox.classList.remove('d-none');
                    setTimeout(() => { window.location.href = '/login/'; }, 1000);
                } else {
                    let msg = 'Registration failed.';
                    if (typeof data === 'object') {
                        msg = Object.entries(data).map(([k, v]) => `${k}: ${v}`).join(' ');
                    }
                    alertBox.className = 'alert alert-danger small';
                    alertBox.textContent = msg;
                    alertBox.classList.remove('d-none');
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger small';
                alertBox.textContent = 'Network error: ' + err.message;
                alertBox.classList.remove('d-none');
            } finally {
                btnText.classList.remove('d-none');
                btnSpinner.classList.add('d-none');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
